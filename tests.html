<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexo Todo tests</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #202020; }
    h1 { font-size: 20px; }
    h2 { font-size: 15px; margin: 22px 0 6px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    #summary { font-weight: 700; padding: 10px 14px; border-radius: 6px; }

    .result.fail { color: #a81f00; font-weight: 600; }
    a { color: #dc4c3e; }

  <h1>Flexo Todo — 5-user permission test scenario</h1>
